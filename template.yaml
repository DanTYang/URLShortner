AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
# ^ This one line is what makes it a SAM template rather than raw
#   CloudFormation. SAM is a macro: AWS expands shorthand like
#   `AWS::Serverless::Function` into the ~8 underlying resources (function,
#   IAM role, permission, API method, integration...) that it really takes.
#   Everything here is still CloudFormation underneath.

Description: >
  Serverless URL Shortener — the single source of truth for the entire stack:
  compute, storage, routing, IAM, dashboards and alarms. Nothing is configured
  by hand in the console, so the infrastructure is reviewed, versioned and
  reproducible: `sam deploy --config-env prod` builds an identical stack in a
  different account with one command.

# ---------------------------------------------------------------------------
# Parameters — everything that differs between environments
# ---------------------------------------------------------------------------
# Any value that changes between dev and prod belongs here, never hard-coded in
# a resource. This is the mechanism that lets one template produce three
# environments.
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment. Namespaces every resource and metric.

  ShortCodeLength:
    Type: Number
    Default: 7
    MinValue: 4
    MaxValue: 16
    Description: Base62 characters per generated code. 62^7 ~= 3.5 trillion.

  ClickRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 3650
    Description: How long raw click events live before TTL deletes them.

  MaxCollisionRetries:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 20
    Description: Collision retries before create_url gives up with a 503.

# ---------------------------------------------------------------------------
# Globals — defaults applied to every function in this template
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]   # Graviton: ~20% cheaper and faster than x86 here.
    Timeout: 10              # Seconds. A redirect takes ~5 ms; this is a
                             # runaway guard, not a target. Lambda bills by
                             # duration, so a stuck function on a low timeout
                             # fails fast and cheap.
    MemorySize: 256          # Memory also scales CPU. 256 MB is past the knee
                             # of the curve for this workload — 128 is slower
                             # enough that it can cost *more* per request.
    Tracing: Active          # X-Ray distributed tracing.
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        # This block is the other half of config.py. Every value the code reads
        # from the environment is injected here, which is what lets the exact
        # same deployment artifact behave differently per environment.
        URLS_TABLE: !Ref UrlsTable
        CLICKS_TABLE: !Ref ClicksTable
        SHORT_CODE_LENGTH: !Ref ShortCodeLength
        CLICK_RETENTION_DAYS: !Ref ClickRetentionDays
        MAX_COLLISION_RETRIES: !Ref MaxCollisionRetries
        METRICS_NAMESPACE: !Sub "URLShortener/${Environment}"
        ENVIRONMENT: !Ref Environment
  Api:
    TracingEnabled: true

Resources:

  # -------------------------------------------------------------------------
  # Shared Lambda layer
  # -------------------------------------------------------------------------
  # A layer is a zip mounted into the function's filesystem at /opt. Because
  # /opt/python is on sys.path, `from urlshortener_common import ...` just
  # works. Packaging the shared code once keeps each function's own deployment
  # package tiny (faster cold starts) and means one fix updates all four.
  # NOTE: deliberately no `Metadata: BuildMethod: python3.12` here.
  # That flag tells SAM "this is a Python layer — create a python/ directory
  # and pip-install requirements.txt into it." But layers/common/ ALREADY has
  # a python/ directory, so SAM nests it again and you get
  #     /opt/python/python/urlshortener_common
  # at runtime, one level below where Lambda looks. The layer has no
  # third-party dependencies (boto3 ships with the runtime), so there is
  # nothing to install and SAM should just copy the directory verbatim.
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "url-shortener-common-${Environment}"
      Description: Shared helpers for the URL shortener functions.
      ContentUri: layers/common/
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete

  # -------------------------------------------------------------------------
  # UrlsTable — one row per short link.
  # -------------------------------------------------------------------------
  # BillingMode: PAY_PER_REQUEST — no capacity is set aside; you pay per
  #   request. The alternative makes you guess your traffic in advance, and
  #   guessing low means requests are throttled during exactly the spike
  #   capacity was meant to absorb. For unpredictable traffic, pay-per-request wins.
  #
  # AttributeDefinitions — list ONLY attributes used in a key or an index.
  #   longUrl and clickCount are deliberately absent; everything outside the
  #   keys is schemaless. Listing an extra attribute fails the deploy.
  #
  # GlobalSecondaryIndexes — a second, automatically-maintained view of the
  #   same table, keyed by owner instead of code. It is the only reason "list
  #   my links, newest first" can avoid reading the whole table.
  #   ProjectionType ALL copies every field into the index, so a lookup needs
  #   no second trip — extra storage bought in exchange for simpler reads.
  #   IndexName must EXACTLY match the string in dynamo.list_urls; a mismatch
  #   fails every owner-filtered listing at runtime.
  #
  # TimeToLiveSpecification — "when the `ttl` field's time passes, delete this
  #   row for free." Deletion is eventual though (AWS says within 48 hours),
  #   which is exactly why dynamo.is_expired ALSO checks on read.
  #
  # PointInTimeRecovery — continuous backups; restore to any second in the last
  #   35 days. The undo button for a bad migration; enable it before it is needed.
  UrlsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "url-shortener-urls-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: shortCode
          AttributeType: S
        - AttributeName: owner
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: shortCode
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: owner-createdAt-index
          KeySchema:
            - AttributeName: owner
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # -------------------------------------------------------------------------
  # ClicksTable — one row per click.
  # -------------------------------------------------------------------------
  # A composite key, unlike UrlsTable.
  #   HASH (shortCode) decides which machine the row
  #   lives on; RANGE (clickId) decides the order rows are stored in on that
  #   machine. So every click for one link sits together, already sorted by
  #   time.
  #
  #   That is the whole reason "give me this link's clicks, newest first" is
  #   one fast read instead of a search-and-sort. The keys are designed around the
  #   question the service actually asks.
  #
  # NO PointInTimeRecovery here, on purpose. These rows are disposable — they
  #   delete themselves after 90 days anyway. Pay for durability in proportion
  #   to what the data is actually worth.
  ClicksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "url-shortener-clicks-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: shortCode
          AttributeType: S
        - AttributeName: clickId
          AttributeType: S
      KeySchema:
        - AttributeName: shortCode
          KeyType: HASH
        - AttributeName: clickId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # -------------------------------------------------------------------------
  # API Gateway
  # -------------------------------------------------------------------------
  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "url-shortener-api-${Environment}"
      StageName: !Ref Environment
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 200
          ThrottlingRateLimit: 100
          MetricsEnabled: true
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  # -------------------------------------------------------------------------
  # Lambda functions — one per endpoint
  # -------------------------------------------------------------------------
  # Least privilege is deliberate: the two read-only functions get
  # DynamoDBReadPolicy rather than Crud, and ListUrlsFunction is not granted
  # access to ClicksTable at all. If any one function is compromised through a
  # bug, its blast radius is bounded by what its role permits.
  #
  # Routing note: `GET /{shortCode}` is a greedy path at the API root, so
  # `/urls` could in principle match it. API Gateway prefers literal paths over
  # variable ones, and shortcode.py additionally refuses to issue reserved
  # codes — defence in depth on both sides.
  CreateUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "url-shortener-create-${Environment}"
      CodeUri: src/create_url/
      Handler: app.handler          # <module>.<function> inside CodeUri
      Description: Creates a short link with collision detection.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UrlsTable
        - CloudWatchPutMetricPolicy: {}
      Events:
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /urls
            Method: post

  RedirectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "url-shortener-redirect-${Environment}"
      CodeUri: src/redirect/
      Handler: app.handler
      Description: Redirects a short link to its long URL and counts the click.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UrlsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ClicksTable
        - CloudWatchPutMetricPolicy: {}
      Events:
        Redirect:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /{shortCode}
            Method: get

  GetAnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "url-shortener-get-analytics-${Environment}"
      CodeUri: src/get_analytics/
      Handler: app.handler
      Description: Returns analytics for a short link.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UrlsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ClicksTable
        - CloudWatchPutMetricPolicy: {}
      Events:
        GetAnalytics:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /urls/{shortCode}/analytics
            Method: get

  ListUrlsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "url-shortener-list-urls-${Environment}"
      CodeUri: src/list_urls/
      Handler: app.handler
      Description: Lists all short links owned by the caller.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UrlsTable
        - CloudWatchPutMetricPolicy: {}
      Events:
        ListUrls:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /urls
            Method: get

  # -------------------------------------------------------------------------
  # Alarm — page when the hot path starts failing
  # -------------------------------------------------------------------------
  # TreatMissingData: notBreaching is the setting that matters. A shortener
  # with no traffic emits no Errors datapoints at all, and CloudWatch's default
  # treats missing data as breaching — so a quiet weekend would page. Alarms
  # that cry wolf get muted, and a muted alarm is worse than no alarm.
  RedirectErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "url-shortener-redirect-errors-${Environment}"
      AlarmDescription: Redirect function is returning errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub "url-shortener-redirect-${Environment}"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  #
  # That last line is the one people get wrong. A URL shortener with no traffic

# ---------------------------------------------------------------------------
# Outputs — printed after every deploy
# ---------------------------------------------------------------------------
# The values needed immediately after a deploy, so nothing has to be looked
# up in the console.
Outputs:
  ApiBaseUrl:
    Description: Base URL of the API. Short links are {ApiBaseUrl}/{code}.
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  CreateUrlEndpoint:
    Description: POST here to create a short link.
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/urls"
  UrlsTableName:
    Description: DynamoDB table storing URL mappings.
    Value: !Ref UrlsTable
  ClicksTableName:
    Description: DynamoDB table storing click events.
    Value: !Ref ClicksTable
